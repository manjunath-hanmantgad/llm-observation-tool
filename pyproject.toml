[project]
name = "llm-observatory"
version = "0.1.0"
description = "Local-first LLM evaluation and monitoring framework with Azure-ready configuration."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.0",
  "httpx==0.27.0",
  "openai==1.35.0",
  "duckdb==0.10.3",
  "pandas==2.2.2",
  "plotly==5.22.0",
  "streamlit==1.36.0",
  "python-dotenv==1.0.1",
  "pydantic==2.7.4",
  "SQLAlchemy==2.0.31",
  "alembic==1.13.2",
  "psycopg[binary]==3.2.1",
  "slack-sdk==3.29.0",
  "azure-cosmos==4.7.0",
  "azure-keyvault-secrets==4.8.0",
  "azure-identity==1.17.0",
  "opencensus-ext-azure==1.1.13"
]

[project.optional-dependencies]
dev = ["pytest==8.2.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
