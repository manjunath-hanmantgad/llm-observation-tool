# Required GitHub Variables (set in repo Settings > Variables > Actions):
#   ACR_LOGIN_SERVER
#   OBSERVATORY_RESOURCE_GROUP
#   OBSERVATORY_GATEWAY_CONTAINER_APP
#   OBSERVATORY_DASHBOARD_CONTAINER_APP
#   OBSERVATORY_GATEWAY_URL
#
# Required GitHub Secrets (set in repo Settings > Secrets > Actions):
#   ACR_USERNAME
#   ACR_PASSWORD
#   AZURE_CREDENTIALS
name: Deploy to Staging

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: llm-observatory
  REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "version=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy gateway to staging Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ vars.OBSERVATORY_GATEWAY_CONTAINER_APP }}
          resourceGroup: ${{ vars.OBSERVATORY_RESOURCE_GROUP }}
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy dashboard to staging Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: ${{ vars.OBSERVATORY_DASHBOARD_CONTAINER_APP }}
          resourceGroup: ${{ vars.OBSERVATORY_RESOURCE_GROUP }}
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: ${{ vars.OBSERVATORY_GATEWAY_URL != '' }}

    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Health check - gateway
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ vars.OBSERVATORY_GATEWAY_URL }}/health)
          echo "HTTP $response"
          [ "$response" = "200" ] || exit 1

      - name: Health check - readiness
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ vars.OBSERVATORY_GATEWAY_URL }}/health/ready)
          echo "HTTP $response"
          [ "$response" = "200" ] || exit 1
